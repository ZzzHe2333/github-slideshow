name: Build Wired IP Switcher (Windows)
on:
  push:
    branches:
      - build/wired-ip-switcher-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell 5.1 syntax
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'ip-switcher/src/network.ps1'
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "SYNTAX ERROR: $($_.Message) line $($_.Extent.StartLineNumber)" }
            throw 'PowerShell syntax check failed'
          }
          Write-Host 'PowerShell syntax passed'
      - name: Exercise read-only adapter discovery with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $src = Get-Content 'ip-switcher/src/network.ps1' -Raw -Encoding utf8
          $code = "$src`nInvoke-WiredSwitch -Action 'list' -Index 0"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($code))
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw "PowerShell discovery failed: $LASTEXITCODE" }
      - name: Build EXE
        run: cargo build --release --manifest-path ip-switcher/Cargo.toml
      - name: Smoke test actual compiled EXE without modifying any IP
        shell: pwsh
        run: |
          $resultFile = Join-Path $env:RUNNER_TEMP 'wired-ip-readonly-diagnostic.txt'
          $exe = Join-Path $PWD 'ip-switcher/target/release/wired-ip-switcher.exe'
          $p = Start-Process -FilePath $exe -ArgumentList "--diagnose-file=$resultFile" -PassThru -Wait
          if (-not (Test-Path $resultFile)) { throw "Diagnostic did not produce a result file. Exit $($p.ExitCode)" }
          $result = Get-Content $resultFile -Raw -Encoding UTF8
          Write-Host $result
          if (-not $result.StartsWith("OK")) { throw "Rust PowerShell discovery smoke test failed" }
      - name: Stage EXE
        shell: pwsh
        run: |
          New-Item -Type Directory -Force dist | Out-Null
          Copy-Item ip-switcher/target/release/wired-ip-switcher.exe dist/Wired-IP-Switcher.exe
          Get-FileHash dist/Wired-IP-Switcher.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Wired-IP-Switcher-Windows-x64
          path: dist/Wired-IP-Switcher.exe
          if-no-files-found: error
